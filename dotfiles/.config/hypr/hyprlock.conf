$font = Noto Sans

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/nicorioso/imagenes/wallpapers/ado1.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

image {
    monitor =
    path = /home/nicorioso/imagenes/perfil/ado-perfil.jpeg
    size = 144
    rounding = 0
    border_size = 2
    border_color = rgb(d6d6d6)
    position = 0, 82
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 38
    color = rgb(f5f5f5)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 22
    color = rgb(f5f5f5)
    position = 0, -24
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 52
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(d6d6d6)
    inner_color = rgb(1b1b1b)
    font_color = rgb(f5f5f5)
    check_color = rgb(a0a0a0)
    fail_color = rgb(f5f5f5)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = $PAMFAIL
    position = 0, -82
    halign = center
    valign = center
}
